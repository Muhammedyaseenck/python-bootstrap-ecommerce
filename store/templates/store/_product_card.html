<div class="card product-card h-100">
  <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.title }}" loading="lazy">
  <div class="card-body d-flex flex-column">
    <h2 class="h6 card-title">{{ product.title }}</h2>
    <p class="card-text text-muted small">{{ product.description|truncatechars:80 }}</p>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="price">&#8377;{{ product.price|floatformat:"0g" }}</span>
      <button type="button" class="btn btn-sm btn-ink">Add to cart</button>
    </div>
  </div>
</div>
